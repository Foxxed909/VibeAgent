<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan thread — VibeAgent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505; --elev: #0e0e0e; --border: #1f1f1f;
      --text: #fafafa; --muted: #a1a1aa; --accent: #22c55e;
      --crit: #ef4444; --info: #3b82f6;
      --font: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(5,5,5,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .job-id { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      background: rgba(34,197,94,0.15); color: var(--accent);
    }
    .badge.running { background: rgba(59,130,246,0.15); color: var(--info); }
    .badge.error { background: rgba(239,68,68,0.15); color: var(--crit); }
    .badge.model { background: rgba(59,130,246,0.12); color: #93c5fd; font-family: var(--mono); font-weight: 500; }
    main { flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 16px 12px 48px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .row.system { justify-content: center; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800; background: #14532d; color: #bbf7d0;
    }
    .avatar.tool { background: #422006; color: #fde68a; }
    .avatar.finding { background: #450a0a; color: #fecaca; }
    .bubble {
      max-width: min(100%, 620px); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 14px; background: var(--elev); line-height: 1.5;
    }
    .row.agent .bubble { border-color: rgba(34,197,94,0.25); background: rgba(22,163,74,0.06); }
    .row.tool .bubble { border-color: rgba(234,179,8,0.2); background: rgba(234,179,8,0.04); }
    .row.finding .bubble { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
    .bubble .who { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .bubble .body { font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
    .bubble .mono { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; }
    .sys-chip {
      font-size: 0.75rem; color: var(--muted); background: #111; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 12px; max-width: 100%; word-break: break-word;
    }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  </style>
</head>
<body>
  <header>
    <a href="/">← VibeAgent</a>
    <span class="job-id" id="job-label">job —</span>
    <span class="badge running" id="status">loading</span>
    <span class="badge model" id="model-badge" hidden></span>
  </header>
  <main id="chat">
    <div class="empty" id="empty">Waiting for agent…</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job') || params.get('id') || '';
    const chat = document.getElementById('chat');
    const empty = document.getElementById('empty');
    const statusEl = document.getElementById('status');
    const modelBadge = document.getElementById('model-badge');
    document.getElementById('job-label').textContent = jobId ? 'job ' + jobId : 'session';
    const seen = new Set();

    function row(kind, who, bodyHtml, isMono) {
      const key = kind + '|' + who + '|' + (bodyHtml || '').slice(0, 100);
      if (seen.has(key)) return;
      seen.add(key);
      empty.hidden = true;
      const wrap = document.createElement('div');
      wrap.className = 'row ' + kind;
      if (kind === 'system') {
        wrap.innerHTML = '<div class="sys-chip"></div>';
        wrap.querySelector('.sys-chip').textContent = bodyHtml;
      } else {
        const av = document.createElement('div');
        av.className = 'avatar ' + kind;
        av.textContent = kind === 'agent' ? 'VA' : kind === 'tool' ? '⚙' : '!';
        const bub = document.createElement('div');
        bub.className = 'bubble';
        const w = document.createElement('div');
        w.className = 'who';
        w.textContent = who;
        const b = document.createElement('div');
        b.className = isMono ? 'mono' : 'body';
        b.textContent = bodyHtml;
        bub.appendChild(w);
        bub.appendChild(b);
        wrap.appendChild(av);
        wrap.appendChild(bub);
      }
      chat.appendChild(wrap);
      wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function setModel(model, provider, effort) {
      if (!model) return;
      modelBadge.hidden = false;
      modelBadge.textContent = (provider ? provider + ' · ' : '') + model + (effort && effort !== 'none' ? ' · reason:' + effort : ' · reason:off');
    }

    function renderReport(report) {
      if (!report) return false;
      statusEl.textContent = report.status || 'completed';
      statusEl.className = 'badge' + (report.status === 'running' ? ' running' : (report.status === 'completed' || report.status === 'dry_run_ok' ? '' : ' error'));
      setModel(report.model, report.provider, report.reasoning_effort);

      for (const ev of report.events || []) {
        const t = ev.type;
        if (t === 'auth_ok') row('system', '', 'Authorized · ' + (ev.tier || '') + (ev.trial ? ' · trial' : '') + ' · ' + JSON.stringify(ev.targets));
        else if (t === 'model_info') setModel(ev.model, ev.provider, ev.reasoning_effort);
        else if (t === 'round') row('system', '', 'Round ' + ev.index + '/' + ev.max);
        else if (t === 'agent_message') row('agent', 'VibeAgent', ev.text || '');
        else if (t === 'reasoning') row('agent', 'reasoning', ev.text || '', true);
        else if (t === 'tool_start') row('tool', 'tool → ' + ev.tool, JSON.stringify(ev.args || {}, null, 2), true);
        else if (t === 'tool_result') row('tool', 'tool ← ' + ev.tool + (ev.ok ? ' · ok' : ' · fail'), ev.preview || '', true);
        else if (t === 'finding') row('finding', 'finding · ' + (ev.severity || ''), ev.detail || '');
        else if (t === 'error') row('finding', 'error', ev.text || '');
        else if (t === 'done') statusEl.textContent = ev.status || report.status || 'done';
      }

      if (seen.size <= 1 && report.tool_calls) {
        for (const tc of report.tool_calls) {
          row('tool', 'tool → ' + tc.tool, JSON.stringify(tc.args || {}), true);
          const out = (tc.result && (tc.result.stdout || tc.result.message)) || tc.blocked || '';
          row('tool', 'tool ← ' + tc.tool, String(out).slice(0, 3000), true);
        }
      }
      if (report.report_text) row('agent', 'VibeAgent · final report', report.report_text);
      return true;
    }

    function loadFromSession() {
      try {
        const raw = sessionStorage.getItem('vibeagent_last_report');
        if (!raw) return null;
        const report = JSON.parse(raw);
        if (jobId && report.job_id && report.job_id !== jobId) return null;
        return report;
      } catch { return null; }
    }

    async function poll() {
      const local = loadFromSession();
      if (local) {
        renderReport(local);
        if (local.status !== 'running') return;
      }
      if (!jobId) {
        if (!local) {
          statusEl.textContent = 'no job';
          statusEl.className = 'badge error';
          empty.textContent = 'No job data. Start a scan from /scan.html';
        }
        return;
      }
      try {
        const res = await fetch('/api/job?id=' + encodeURIComponent(jobId));
        const data = await res.json();
        if (data.ok && data.report) {
          sessionStorage.setItem('vibeagent_last_report', JSON.stringify(data.report));
          renderReport(data.report);
          if (data.report.status === 'running') setTimeout(poll, 1500);
        }
      } catch (e) {}
    }
    poll();
  </script>
</body>
</html>
