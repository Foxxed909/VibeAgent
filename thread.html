<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan thread — VibeAgent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505; --elev: #0e0e0e; --border: #1f1f1f;
      --text: #fafafa; --muted: #a1a1aa; --accent: #22c55e;
      --crit: #ef4444; --info: #3b82f6;
      --font: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(5,5,5,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .job-id { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(34,197,94,0.15); color: var(--accent); }
    .badge.running { background: rgba(59,130,246,0.15); color: var(--info); }
    .badge.error { background: rgba(239,68,68,0.15); color: var(--crit); }
    .badge.model { background: rgba(59,130,246,0.12); color: #93c5fd; font-family: var(--mono); font-weight: 500; }
    .header-spacer { flex: 1; }
    .report-links { display: flex; gap: 6px; margin-left: auto; }
    .report-link {
      display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 7px;
      border: 1px solid var(--border); background: #111; color: var(--muted);
      font-family: var(--mono); font-size: 0.7rem; text-decoration: none;
    }
    .report-link:hover { color: var(--text); border-color: #333; }
    main { flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 16px 12px 48px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .row.system { justify-content: center; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800; background: #14532d; color: #bbf7d0;
    }
    .avatar.tool { background: #422006; color: #fde68a; }
    .avatar.finding { background: #450a0a; color: #fecaca; }
    .bubble {
      max-width: min(100%, 620px); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 14px; background: var(--elev); line-height: 1.5;
    }
    .row.agent .bubble { border-color: rgba(34,197,94,0.25); background: rgba(22,163,74,0.06); }
    .row.tool .bubble { border-color: rgba(234,179,8,0.2); background: rgba(234,179,8,0.04); }
    .row.finding .bubble { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
    .bubble .who { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .bubble .body { font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
    .bubble .mono { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; }
    .sys-chip {
      font-size: 0.75rem; color: var(--muted); background: #111; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 12px; max-width: 100%; word-break: break-word;
    }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  </style>
</head>
<body>
  <header>
    <a href="/app" id="back-link">← Workspace</a>
    <a href="/settings">⚙ Keys</a>
    <span class="job-id" id="job-label">job —</span>
    <span class="badge" id="agent-badge">VibeAgent</span>
    <span class="badge running" id="status">loading</span>
    <span class="badge model" id="model-badge" hidden></span>
    <span class="badge model" id="finding-badge" hidden></span>
    <span class="header-spacer"></span>
    <button class="report-link" type="button" id="cancel-job" hidden>Cancel scan</button>
    <a class="report-link" id="demo-other" href="#" hidden>Try other agent</a>
    <button class="report-link" type="button" id="demo-json" hidden>Download sample JSON</button>
    <span class="report-links" id="report-links" hidden>
      <a class="report-link" id="json-report" href="#">JSON</a>
      <a class="report-link" id="sarif-report" href="#">SARIF</a>
    </span>
  </header>
  <main id="chat">
    <div class="empty" id="empty">Waiting for agent…</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job') || params.get('id') || '';
    const live = params.get('live') === '1';
    const queued = params.get('queued') === '1';
    // A client-only UI simulation; no scan, model request, or storage operation.
    const demoMode = ['vibe', 'break'].includes(params.get('demo')) ? params.get('demo') : '';
    const chat = document.getElementById('chat');
    const empty = document.getElementById('empty');
    const statusEl = document.getElementById('status');
    const agentBadge = document.getElementById('agent-badge');
    const modelBadge = document.getElementById('model-badge');
    const findingBadge = document.getElementById('finding-badge');
    const reportLinks = document.getElementById('report-links');
    const cancelBtn = document.getElementById('cancel-job');
    const jsonReport = document.getElementById('json-report');
    const sarifReport = document.getElementById('sarif-report');
    document.getElementById('job-label').textContent = jobId ? 'job ' + jobId : (live ? 'live scan' : 'session');
    const seen = new Set();
    let finalReport = null;
    let currentAgent = 'VibeAgent';

    function setAgent(name) {
      currentAgent = name === 'BreakAgent' ? 'BreakAgent' : 'VibeAgent';
      agentBadge.textContent = currentAgent;
      document.title = 'Scan thread — ' + currentAgent;
    }

    function row(kind, who, bodyHtml, isMono) {
      const key = kind + '|' + who + '|' + (bodyHtml || '').slice(0, 100);
      if (seen.has(key)) return;
      seen.add(key);
      empty.hidden = true;
      const wrap = document.createElement('div');
      wrap.className = 'row ' + kind;
      if (kind === 'system') {
        wrap.innerHTML = '<div class="sys-chip"></div>';
        wrap.querySelector('.sys-chip').textContent = bodyHtml;
      } else {
        const av = document.createElement('div');
        av.className = 'avatar ' + kind;
        av.textContent = kind === 'agent' ? (currentAgent === 'BreakAgent' ? 'BA' : 'VA') : kind === 'tool' ? '⚙' : '!';
        const bub = document.createElement('div');
        bub.className = 'bubble';
        const w = document.createElement('div');
        w.className = 'who';
        w.textContent = who;
        const b = document.createElement('div');
        b.className = isMono ? 'mono' : 'body';
        b.textContent = bodyHtml;
        bub.appendChild(w); bub.appendChild(b);
        wrap.appendChild(av); wrap.appendChild(bub);
      }
      chat.appendChild(wrap);
      wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function setReportLinks(id) {
      if (!id) return;
      const encoded = encodeURIComponent(id);
      jsonReport.href = '/api/report?id=' + encoded + '&format=json';
      sarifReport.href = '/api/report?id=' + encoded + '&format=sarif';
      reportLinks.hidden = false;
    }

    function setFindingSummary(report) {
      const summary = report && report.summary;
      if (!summary) return;
      const severity = summary.severity || {};
      findingBadge.hidden = false;
      findingBadge.textContent =
        (summary.total_findings || 0) + ' findings' +
        (severity.critical ? ' · ' + severity.critical + ' crit' : '') +
        (severity.high ? ' · ' + severity.high + ' high' : '');
    }

    function setModel(model, provider, effort) {
      if (!model) return;
      modelBadge.hidden = false;
      modelBadge.textContent = (provider ? provider + ' · ' : '') + model + (effort && effort !== 'none' ? ' · reason:' + effort : ' · reason:off');
    }

    function handleEvent(ev) {
      const t = ev.type;
      if (t === 'auth_ok') {
        setAgent(ev.agent_name || (ev.agent_mode === 'break' ? 'BreakAgent' : 'VibeAgent'));
        row('system', '', currentAgent + ' · ' + (ev.execution_backend || 'portable') + ' · Authorized · ' + (ev.tier || '') + (ev.trial ? ' · trial' : '') + (ev.depth ? ' · ' + ev.depth : '') + ' · ' + JSON.stringify(ev.targets));
      }
      else if (t === 'model_info') setModel(ev.model, ev.provider, ev.reasoning_effort);
      else if (t === 'round') row('system', '', 'Round ' + ev.index + '/' + ev.max);
      else if (t === 'agent_message') row('agent', currentAgent, ev.text || '');
      else if (t === 'reasoning') row('agent', 'reasoning', ev.text || '', true);
      else if (t === 'tool_start') row('tool', 'tool → ' + ev.tool, JSON.stringify(ev.args || {}, null, 2), true);
      else if (t === 'tool_result') {
        const backend = ev.backend ? ' · ' + ev.backend : '';
        row('tool', 'tool ← ' + ev.tool + backend + (ev.ok ? ' · ok' : ' · fail'), ev.preview || '', true);
      }
      else if (t === 'finding') {
        const title = ev.title || ev.detail || 'Finding';
        const meta = [
          ev.validation_status,
          ev.cwe,
          ev.owasp,
          ev.location
        ].filter(Boolean).join(' · ');
        row(
          'finding',
          'finding · ' + (ev.severity || 'info'),
          title + (meta ? '\n' + meta : '') + (ev.evidence && ev.evidence !== title ? '\n\n' + ev.evidence : '')
        );
      }
      else if (t === 'error') row('finding', 'error', ev.text || '');
      else if (t === 'done') {
        statusEl.textContent = ev.status || 'done';
        statusEl.className = 'badge' + (ev.status === 'completed' || ev.status === 'dry_run_ok' ? '' : (ev.status === 'running' ? ' running' : ' error'));
      } else if (t === 'final') {
        if (ev.ok && ev.report) {
          finalReport = ev.report;
          if (ev.report.browser_only) {
            // One-time real result. Do not create a durable report link, write
            // company evidence to sessionStorage or claim cloud persistence.
            document.getElementById('job-label').textContent = 'private real scan';
            const download = document.getElementById('demo-json');
            download.hidden = false;
            download.textContent = 'Download real JSON';
            download.onclick = () => {
              const blob = new Blob([JSON.stringify(ev.report, null, 2)], {type: 'application/json'});
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = 'vibeagent-real-report.json';
              link.click();
              URL.revokeObjectURL(url);
            };
            row('system', '', 'REAL LIVE SCAN · No server-side report history. Download your result before leaving this page.');
          } else {
            sessionStorage.setItem('vibeagent_last_report', JSON.stringify(ev.report));
            if (ev.report.job_id) {
              document.getElementById('job-label').textContent = 'job ' + ev.report.job_id;
              history.replaceState({}, '', '/thread?job=' + encodeURIComponent(ev.report.job_id));
              setReportLinks(ev.report.job_id);
            }
          }
          setFindingSummary(ev.report);
          setModel(ev.report.model, ev.report.provider, ev.report.reasoning_effort);
          statusEl.textContent = ev.report.status || 'completed';
          statusEl.className = 'badge' + (ev.report.status === 'completed' || ev.report.status === 'dry_run_ok' ? '' : ' error');
          if (ev.report.report_text) row('agent', currentAgent + ' · final report', ev.report.report_text);
        } else {
          statusEl.textContent = 'error';
          statusEl.className = 'badge error';
          row('finding', 'error', ev.error || 'Scan failed');
        }
      }
    }

    function renderReport(report) {
      if (!report) return;
      setAgent(report.agent_name || (report.agent_mode === 'break' ? 'BreakAgent' : 'VibeAgent'));
      if (report.job_id) setReportLinks(report.job_id);
      setFindingSummary(report);
      statusEl.textContent = report.status || 'completed';
      statusEl.className = 'badge' + (report.status === 'running' ? ' running' : (report.status === 'completed' || report.status === 'dry_run_ok' ? '' : ' error'));
      setModel(report.model, report.provider, report.reasoning_effort);
      for (const ev of report.events || []) handleEvent(ev);
      if (report.report_text) row('agent', currentAgent + ' · final report', report.report_text);
    }


    async function startDemo() {
      // Never call any API, read secrets, or persist a sample as a real scan.
      // All content uses a reserved .invalid hostname and is explicitly fictional.
      setAgent(demoMode === 'break' ? 'BreakAgent' : 'VibeAgent');
      document.getElementById('back-link').href = '/scan';
      document.getElementById('back-link').textContent = '← Back to Scan';
      const other = document.getElementById('demo-other');
      other.href = '/thread?demo=' + (demoMode === 'break' ? 'vibe' : 'break');
      other.textContent = demoMode === 'break' ? 'Try VibeAgent' : 'Try BreakAgent';
      other.hidden = false;
      document.getElementById('job-label').textContent = 'SAMPLE · NOT A REAL SCAN';
      statusEl.textContent = 'demo · running';
      statusEl.className = 'badge running';
      setModel('UI simulation (no AI called)', 'demo', 'none');
      row('system', '', 'DEMO ONLY — Fictional results. No website, API key, ownership challenge, or external model is used.');
      row('system', '', 'Explore the thread UI. Production scans still require target ownership verification and scan access.');
      const target = 'https://example.invalid';
      const finding = {
        id: 'DEMO-FINDING-001',
        title: demoMode === 'break' ? 'Sample session-cookie observation' : 'Sample missing security header',
        severity: 'low',
        validation_status: 'fictional-example',
        tool: demoMode === 'break' ? 'phantom' : 'vibe_headers',
        location: target,
        evidence: 'FAKE SAMPLE EVIDENCE — no request was sent and no actual vulnerability was found.',
        cwe: demoMode === 'break' ? 'CWE-614' : 'CWE-693',
        recommendation: demoMode === 'break'
          ? 'For a real finding, review HttpOnly, Secure, and SameSite on authenticated cookies.'
          : 'For a real finding, review which defensive response headers apply to this endpoint.'
      };
      const toolName = finding.tool;
      const steps = [
        {type: 'round', index: 1, max: 3},
        {type: 'agent_message', text: 'DEMO: Mapping application entry points and trust boundaries for a fictional service.'},
        {type: 'tool_start', tool: 'cloud_scout', args: {url: target}},
        {type: 'tool_result', tool: 'cloud_scout', backend: 'simulation', ok: true, preview: 'SAMPLE: edge and host metadata would appear here (no network activity).'},
        {type: 'round', index: 2, max: 3},
        {type: 'agent_message', text: demoMode === 'break'
          ? 'DEMO: Comparing the expected secure session-cookie policy with fictional evidence.'
          : 'DEMO: Prioritizing a safe response-header policy check.'},
        {type: 'tool_start', tool: toolName, args: {url: target}},
        {type: 'tool_result', tool: toolName, backend: 'simulation', ok: true, preview: finding.evidence},
        {type: 'finding', ...finding},
        {type: 'round', index: 3, max: 3},
        {type: 'agent_message', text: 'DEMO: In a real scan, the agent would check negative controls and reproduce observations before reporting.'}
      ];
      for (const event of steps) {
        await new Promise(resolve => setTimeout(resolve, 350));
        handleEvent(event);
      }
      const report = {
        demo: true,
        status: 'demo_complete',
        agent_mode: demoMode,
        agent_name: currentAgent,
        execution_backend: 'client-only simulation',
        model: 'UI simulation (no AI called)',
        provider: 'demo',
        targets: [target],
        summary: {total_findings: 1, severity: {low: 1}, errors: 0},
        findings: [finding],
        report_text: '# SAMPLE REPORT — NOT A SECURITY ASSESSMENT\n\n'
          + 'This is an invented demonstration of VibeAgent UI components. '
          + 'No live target was contacted and no model or scanning engine ran.\n\n'
          + '## Findings\n\n- ' + finding.title
          + ' (fictional low severity). Evidence: ' + finding.evidence
          + '\n\nRemediation example: ' + finding.recommendation
      };
      // Do not set job_id, call setReportLinks, write job storage, or expose
      // download links backed by the real report API.
      finalReport = report;
      setFindingSummary(report);
      row('agent', currentAgent + ' · sample report', report.report_text);
      statusEl.textContent = 'demo complete';
      statusEl.className = 'badge';
      const button = document.getElementById('demo-json');
      button.hidden = false;
      button.onclick = () => {
        const blob = new Blob([JSON.stringify(report, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vibeagent-demo-sample.json';
        a.click();
        URL.revokeObjectURL(url);
      };
      row('system', '', 'Sample complete! Download a sample report or return to /scan for a real, verified scan.');
    }

    async function startQueue() {
      const token = sessionStorage.getItem('vibeagent_cancel_' + jobId);
      cancelBtn.hidden = !token;
      cancelBtn.onclick = async () => {
        if (!token || !confirm('Cancel this assessment at its next safe checkpoint?')) return;
        cancelBtn.disabled = true;
        try {
          const response = await fetch('/api/queue', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'cancel', job_id: jobId, cancel_token: token})
          });
          const body = await response.json();
          row('system', '', body.ok ? 'Cancellation requested.' : (body.error || 'Could not cancel this job.'));
        } catch {
          row('finding', 'error', 'Cancellation request could not reach the server.');
          cancelBtn.disabled = false;
        }
      };
      statusEl.textContent = 'queued';
      statusEl.className = 'badge running';
      row('system', '', 'Reading durable worker events. This page can be reloaded or bookmarked.');
      let after = '0-0';
      let failures = 0;
      const terminalStatuses = new Set(['completed', 'partial', 'failed', 'cancelled', 'dry_run_ok']);
      while (true) {
        try {
          const response = await fetch('/api/events?id=' + encodeURIComponent(jobId) + '&after=' + encodeURIComponent(after), {cache: 'no-store'});
          if (!response.ok) throw new Error('Progress endpoint HTTP ' + response.status);
          const data = await response.json();
          if (!data.ok) throw new Error(data.error || 'Progress is unavailable');
          failures = 0;
          after = data.next_cursor || after;
          for (const event of data.events || []) {
            if (event.type === 'queued' || event.type === 'started' || event.type === 'notice') {
              row('system', '', event.text || event.type);
            } else if (event.type !== 'final') {
              handleEvent(event);
            }
          }
          if (terminalStatuses.has(data.status)) {
            const finalResponse = await fetch('/api/job?id=' + encodeURIComponent(jobId), {cache: 'no-store'});
            const finalData = await finalResponse.json();
            if (finalData.ok && finalData.report) {
              const report = finalData.report;
              renderReport({...report, events: []});
              sessionStorage.setItem('vibeagent_last_report', JSON.stringify(report));
            } else {
              statusEl.textContent = 'report unavailable';
              statusEl.className = 'badge error';
            }
            cancelBtn.hidden = true;
            return;
          }
          statusEl.textContent = data.status || 'running';
          statusEl.className = 'badge running';
        } catch (error) {
          failures += 1;
          if (failures === 1) row('finding', 'error', 'Connection interrupted; retrying: ' + error);
          statusEl.textContent = 'reconnecting';
          statusEl.className = 'badge error';
        }
        await new Promise(resolve => setTimeout(resolve, Math.min(2000 * Math.max(1, failures), 10000)));
      }
    }

    async function startLive() {
      const raw = sessionStorage.getItem('vibeagent_pending_scan');
      sessionStorage.removeItem('vibeagent_pending_scan');
      if (!raw) {
        statusEl.textContent = 'no payload';
        statusEl.className = 'badge error';
        empty.textContent = 'No pending scan. Start from /scan';
        return;
      }
      let payload;
      try { payload = JSON.parse(raw); } catch {
        empty.textContent = 'Bad pending payload'; return;
      }
      setAgent(payload.agent_mode === 'break' ? 'BreakAgent' : 'VibeAgent');
      statusEl.textContent = 'streaming';
      statusEl.className = 'badge running';
      row('system', '', 'Connecting live stream…');

      // Never include an operator token in the request JSON, scan report or logs.
      const scanApiToken = typeof payload.scan_api_token === 'string' ? payload.scan_api_token : '';
      delete payload.scan_api_token;
      let requestBody = JSON.stringify(payload);
      if (payload.provider_keys) {
        for (const provider of Object.keys(payload.provider_keys)) payload.provider_keys[provider] = '';
        delete payload.provider_keys;
      }

      try {
        const res = await fetch('/api/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(scanApiToken ? {'X-VibeAgent-Token': scanApiToken} : {})
          },
          body: requestBody,
        });
        if (!res.ok || !res.body) {
          // Never silently resubmit a scan to another endpoint: the first
          // request may already have started a billable assessment.
          let detail = '';
          try {
            const payload = await res.json();
            detail = payload.error || '';
          } catch {}
          requestBody = '';
          statusEl.textContent = 'error';
          statusEl.className = 'badge error';
          row('finding', 'error', detail || 'The streaming request could not start. No retry was submitted.');
          return;
        }
        requestBody = '';
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let terminalEvent = false;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop() || '';
          for (const part of parts) {
            const line = part.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            try {
              const ev = JSON.parse(line.slice(6));
              if (ev.type === 'final') terminalEvent = true;
              handleEvent(ev);
            } catch {}
          }
        }
        if (!terminalEvent) {
          statusEl.textContent = 'interrupted';
          statusEl.className = 'badge error';
          row('finding', 'error', 'Stream ended without a final result. Assessment outcome is unknown.');
        }
      } catch (e) {
        requestBody = '';
        row('finding', 'error', String(e));
        statusEl.textContent = 'error';
        statusEl.className = 'badge error';
      }
    }

    async function loadExisting() {
      const local = (() => {
        try {
          const raw = sessionStorage.getItem('vibeagent_last_report');
          if (!raw) return null;
          const report = JSON.parse(raw);
          if (jobId && report.job_id && report.job_id !== jobId) return null;
          return report;
        } catch { return null; }
      })();
      if (local) renderReport(local);
      if (!jobId) {
        if (!local) {
          statusEl.textContent = 'no job';
          statusEl.className = 'badge error';
          empty.textContent = 'No job data. Start a scan from /scan';
        }
        return;
      }
      try {
        const res = await fetch('/api/job?id=' + encodeURIComponent(jobId));
        const data = await res.json();
        if (data.ok && data.report) {
          sessionStorage.setItem('vibeagent_last_report', JSON.stringify(data.report));
          renderReport(data.report);
          if (data.report.queue_mode && (data.report.status === 'queued' || data.report.status === 'running')) {
            startQueue();
          }
        }
      } catch {}
    }

    if (demoMode) startDemo();
    else if (live) startLive();
    else if (queued && jobId) startQueue();
    else loadExisting();
  </script>
</body>
</html>
