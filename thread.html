<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scan thread — VibeAgent</title>
  <meta name="description" content="Live agent transcript — tool calls, findings, and the final report as they stream." />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .thread-head {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
      background: color-mix(in srgb, var(--paper) 85%, transparent); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line); padding: 12px var(--gutter);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .thread-head a.back { color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.84rem; }
    .thread-head a.back:hover { color: var(--brand); }
    .job-id { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-faint); }
    .status {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 4px 11px; border-radius: var(--radius-pill); text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--brand-tint); color: var(--brand);
    }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.running { background: var(--signal-tint); color: var(--signal); }
    .status.running::before { animation: pulse 1.1s ease-in-out infinite; }
    .status.error { background: var(--sev-crit-tint); color: var(--sev-crit); }
    @keyframes pulse { 50% { opacity: .35; } }
    .model-badge { font-family: var(--font-mono); font-size: 0.72rem; color: var(--sev-low); background: var(--sev-low-tint); padding: 4px 10px; border-radius: var(--radius-pill); }

    main { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 20px var(--gutter) 64px; display: flex; flex-direction: column; gap: 12px; }

    .row { display: flex; gap: 12px; animation: fadeIn .22s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .row.system { justify-content: center; }
    .avatar {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center; font-family: var(--font-mono);
      font-size: 0.72rem; font-weight: 600;
      background: var(--brand-tint); color: var(--brand);
    }
    .avatar.tool { background: var(--signal-tint); color: var(--signal); }
    .avatar.finding { background: var(--sev-crit-tint); color: var(--sev-crit); }
    .bubble { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 15px; background: var(--surface); box-shadow: var(--shadow); }
    .row.agent .bubble { border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); }
    .row.tool .bubble { border-color: color-mix(in srgb, var(--signal) 22%, var(--line)); }
    .row.finding .bubble { border-color: color-mix(in srgb, var(--sev-crit) 30%, var(--line)); background: var(--sev-crit-tint); }
    .who { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
    .body { font-size: 0.94rem; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
    .body.mono { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); max-height: 300px; overflow: auto; background: var(--paper); border-radius: var(--radius-sm); padding: 10px 12px; }
    .sys-chip { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 5px 14px; max-width: 100%; word-break: break-word; text-align: center; }
    .empty { text-align: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 0.86rem; padding: 60px 16px; }
    .theme-toggle { margin-left: auto; }
  </style>
</head>
<body>
  <header class="thread-head">
    <a href="/" class="back">← VibeAgent</a>
    <span class="job-id" id="job-label">job —</span>
    <span class="status running" id="status">loading</span>
    <span class="model-badge" id="model-badge" hidden></span>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">◐</button>
  </header>
  <main id="chat">
    <div class="empty" id="empty">Waiting for agent…</div>
  </main>
  <script>
    (function () {
      var root = document.documentElement, KEY = "vibeagent-theme";
      try { var s = localStorage.getItem(KEY); if (s) root.setAttribute("data-theme", s); } catch (e) {}
      var btn = document.getElementById("theme-toggle");
      if (btn) btn.onclick = function () {
        var dark = root.getAttribute("data-theme") === "dark" ||
          (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
        var next = dark ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(KEY, next); } catch (e) {}
      };
    })();

    var params = new URLSearchParams(location.search);
    var jobId = params.get("job") || params.get("id") || "";
    var live = params.get("live") === "1";
    var chat = document.getElementById("chat");
    var empty = document.getElementById("empty");
    var statusEl = document.getElementById("status");
    var modelBadge = document.getElementById("model-badge");
    document.getElementById("job-label").textContent = jobId ? "job " + jobId : (live ? "live scan" : "session");
    var seen = new Set();

    var SEV = { critical: "sev-crit", high: "sev-high", medium: "sev-med", low: "sev-low", info: "sev-info" };

    function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = "status" + (cls ? " " + cls : ""); }

    function row(kind, who, bodyText, isMono, severity) {
      var key = kind + "|" + who + "|" + (bodyText || "").slice(0, 100);
      if (seen.has(key)) return;
      seen.add(key);
      empty.hidden = true;
      var wrap = document.createElement("div");
      wrap.className = "row " + kind;
      if (kind === "system") {
        var chip = document.createElement("div");
        chip.className = "sys-chip";
        chip.textContent = bodyText;
        wrap.appendChild(chip);
      } else {
        var av = document.createElement("div");
        av.className = "avatar " + kind;
        av.textContent = kind === "agent" ? "VA" : kind === "tool" ? "⚙" : "!";
        var bub = document.createElement("div");
        bub.className = "bubble";
        var w = document.createElement("div");
        w.className = "who";
        if (kind === "finding" && severity && SEV[severity]) {
          var sev = document.createElement("span");
          sev.className = "sev " + SEV[severity];
          sev.textContent = severity;
          w.appendChild(sev);
          var lbl = document.createElement("span");
          lbl.textContent = " " + who;
          lbl.style.marginLeft = "8px";
          w.appendChild(lbl);
        } else {
          w.textContent = who;
        }
        var b = document.createElement("div");
        b.className = "body" + (isMono ? " mono" : "");
        b.textContent = bodyText;
        bub.appendChild(w); bub.appendChild(b);
        wrap.appendChild(av); wrap.appendChild(bub);
      }
      chat.appendChild(wrap);
      wrap.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function setModel(model, provider, effort) {
      if (!model) return;
      modelBadge.hidden = false;
      modelBadge.textContent = (provider ? provider + " · " : "") + model + (effort && effort !== "none" ? " · reason:" + effort : " · reason:off");
    }

    function handleEvent(ev) {
      var t = ev.type;
      if (t === "auth_ok") row("system", "", "Authorized · " + (ev.tier || "") + (ev.trial ? " · trial" : "") + (ev.depth ? " · " + ev.depth : "") + " · " + JSON.stringify(ev.targets));
      else if (t === "model_info") setModel(ev.model, ev.provider, ev.reasoning_effort);
      else if (t === "round") row("system", "", "Round " + ev.index + " / " + ev.max);
      else if (t === "agent_message") row("agent", "VibeAgent", ev.text || "");
      else if (t === "reasoning") row("agent", "reasoning", ev.text || "", true);
      else if (t === "tool_start") row("tool", "tool → " + ev.tool, JSON.stringify(ev.args || {}, null, 2), true);
      else if (t === "tool_result") row("tool", "tool ← " + ev.tool + (ev.ok ? " · ok" : " · fail"), ev.preview || "", true);
      else if (t === "finding") row("finding", (ev.tool || "finding"), ev.detail || "", false, ev.severity || "info");
      else if (t === "error") row("finding", "error", ev.text || "", false, "critical");
      else if (t === "done") {
        var okDone = ev.status === "completed" || ev.status === "dry_run_ok";
        setStatus(ev.status || "done", okDone ? "" : (ev.status === "running" ? "running" : "error"));
      } else if (t === "final") {
        if (ev.ok && ev.report) {
          try { sessionStorage.setItem("vibeagent_last_report", JSON.stringify(ev.report)); } catch (e) {}
          if (ev.report.job_id) {
            document.getElementById("job-label").textContent = "job " + ev.report.job_id;
            history.replaceState({}, "", "/thread.html?job=" + encodeURIComponent(ev.report.job_id));
          }
          setModel(ev.report.model, ev.report.provider, ev.report.reasoning_effort);
          setStatus(ev.report.status || "completed", "");
          if (ev.report.report_text) row("agent", "VibeAgent · final report", ev.report.report_text);
        } else {
          setStatus("error", "error");
          row("finding", "error", ev.error || "Scan failed", false, "critical");
        }
      }
    }

    function renderReport(report) {
      if (!report) return;
      var running = report.status === "running";
      var okDone = report.status === "completed" || report.status === "dry_run_ok";
      setStatus(report.status || "completed", running ? "running" : (okDone ? "" : "error"));
      setModel(report.model, report.provider, report.reasoning_effort);
      (report.events || []).forEach(handleEvent);
      if (report.report_text) row("agent", "VibeAgent · final report", report.report_text);
    }

    async function startLive() {
      var raw = null;
      try { raw = sessionStorage.getItem("vibeagent_pending_scan"); } catch (e) {}
      if (!raw) { setStatus("no payload", "error"); empty.textContent = "No pending scan. Start from /scan.html"; return; }
      var payload;
      try { payload = JSON.parse(raw); } catch (e) { empty.textContent = "Bad pending payload."; return; }
      try { sessionStorage.removeItem("vibeagent_pending_scan"); } catch (e) {}
      setStatus("streaming", "running");
      row("system", "", "Connecting live stream…");
      try {
        var res = await fetch("/api/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!res.ok || !res.body) {
          var r2 = await fetch("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          var data = await r2.json();
          if (data.ok && data.report) { try { sessionStorage.setItem("vibeagent_last_report", JSON.stringify(data.report)); } catch (e) {} renderReport(data.report); }
          else { row("finding", "error", (data && data.error) || "Scan failed", false, "critical"); setStatus("error", "error"); }
          return;
        }
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buf = "";
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buf += decoder.decode(chunk.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop() || "";
          for (var i = 0; i < parts.length; i++) {
            var line = parts[i].split("\n").find(function (l) { return l.indexOf("data: ") === 0; });
            if (!line) continue;
            try { handleEvent(JSON.parse(line.slice(6))); } catch (e) {}
          }
        }
      } catch (e) {
        row("finding", "error", String(e), false, "critical");
        setStatus("error", "error");
      }
    }

    async function loadExisting() {
      var local = null;
      try {
        var raw = sessionStorage.getItem("vibeagent_last_report");
        if (raw) { var r = JSON.parse(raw); if (!(jobId && r.job_id && r.job_id !== jobId)) local = r; }
      } catch (e) {}
      if (local) renderReport(local);
      if (!jobId) { if (!local) { setStatus("no job", "error"); empty.textContent = "No job data. Start a scan from /scan.html"; } return; }
      try {
        var res = await fetch("/api/job?id=" + encodeURIComponent(jobId));
        var data = await res.json();
        if (data.ok && data.report) { try { sessionStorage.setItem("vibeagent_last_report", JSON.stringify(data.report)); } catch (e) {} renderReport(data.report); }
      } catch (e) {}
    }

    if (live) startLive(); else loadExisting();
  </script>
</body>
</html>
